<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treasure Hunter</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="chart"></div><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="grain"></div></div>

  <div class="shell">
    <header class="titlebar">
      <div class="brand" id="tbBrand"></div>
      <div class="crumb" id="crumb">Painel</div>
      <div class="spacer"></div>
      <span class="pill" id="tbStatus"><span class="dot"></span><span>Parado</span></span>
      <div class="winbtns">
        <button id="wTray" title="Minimizar para a bandeja"></button>
        <button id="wMin" title="Minimizar"></button>
        <button id="wMax" title="Maximizar"></button>
        <button id="wClose" class="close" title="Fechar"></button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="crest" id="crest"></div>
      <nav class="nav" id="nav">
        <div class="indicator" id="navInd"></div>
        <a data-view="painel"></a>
        <a data-view="visao"></a>
        <a data-view="tesouros"></a>
        <button class="nav-more" id="navMore"></button>
        <div class="nav-adv" id="navAdv">
          <a data-view="video"></a>
          <a data-view="parada"></a>
          <a data-view="desempenho"></a>
          <a data-view="config"></a>
          <a data-view="diagnostico"></a>
        </div>
      </nav>
      <div class="side-foot">
        <div class="mode-chip" id="modeChip"></div>
        <button class="emergency" id="btnEmergency"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="view" id="v-painel"></section>
      <section class="view" id="v-tesouros"></section>
      <section class="view" id="v-visao"></section>
      <section class="view" id="v-video"></section>
      <section class="view" id="v-parada"></section>
      <section class="view" id="v-desempenho"></section>
      <section class="view" id="v-config"></section>
      <section class="view" id="v-diagnostico"></section>
    </main>
  </div>

  <div class="modal" id="modal"><div class="sheet glass" id="modalSheet"></div></div>
  <div class="modal viewer" id="viewer"></div>
  <div class="toasts" id="toasts"></div>
  <div class="legend" id="legend"><div class="veil"></div><div class="rays"></div><canvas></canvas>
    <div class="center"><div class="seal"></div><div class="kicker">Tesouro lendário</div><h2></h2><p></p></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
